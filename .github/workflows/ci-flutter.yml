name: Flutter CI

# Trigger the workflow on every push to any branch
on:
  push:

# Sets permissions of the GITHUB_TOKEN to allow writing to the repository
permissions:
  contents: write

jobs:
  flutter-build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  # Clone the repository into the runner

      - name: Set up Flutter
        uses: subosito/flutter-action@v2  # Install Flutter SDK
        with:
          flutter-version: '3.29.0'  # Set the Flutter version to use

      - name: Install dependencies
        run: flutter pub get  # Install all pub dependencies

      - name: Analyze code
        run: flutter analyze  # Run static analysis on the codebase

      - name: Build APK
        run: flutter build apk --release  # Build the app in release mode for Android

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4 # Upload the built APK as an artifact
        with:
          name: Releases
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Extract version from pubspec.yaml
        id: extract_version # Extract the version from pubspec.yaml
        run: |
          version=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r') #
          echo "VERSION=$version" >> $GITHUB_ENV
      
      - name: Check if Tag Exists
        id: check_tag # Check if the tag already exists in the repository
        run: |
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Modify Tag
        if: env.TAG_EXISTS == 'true'
        id: modify_tag
        run: |
          new_version="${{ env.VERSION }}-build-${{ github.run_number }}"
          echo "VERSION=$new_version" >> $GITHUB_ENV

      - name: Create Release
        uses: ncipollo/release-action@v1 # Create a new release in the repository
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: v${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          replacesArtifacts: true # Replace existing artifacts with the new ones
          updateOnlyUnreleased: false # Create a new release even if the tag already exists
